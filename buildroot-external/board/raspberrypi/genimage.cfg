image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start4.elf",
			"Image",
		}
	}

	size = 32M
}

image lib.ext4 {
    name = "lib"
    ext4 {
		files = {
			"ssh/ssh_host_rsa_key",
			"ssh/ssh_host_ecdsa_key",
			"ssh/ssh_host_ed25519_key",
		}
	}
    size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
        size=64M
	}

    partition lib {
        partition-type = 0x83
        image = "lib.ext4"
    }
}
